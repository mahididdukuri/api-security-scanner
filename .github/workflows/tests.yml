name: Run Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: api_security_scanner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d api_security_scanner"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_PASSWORD: postgres
      JWT_SECRET: github-actions-test-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run database migrations
        run: alembic upgrade head

      - name: Start vulnerable API
        run: |
          uvicorn vulnerable_api:app --host 127.0.0.1 --port 8004 &
          sleep 5

      - name: Run tests
        run: pytest